name: Validate submission

# SECURITY: this trigger is `pull_request` (NOT `pull_request_target`), so it
# never has access to repo secrets and can safely run on code from a fork.
# Its only output is a verdict artifact; it never merges or writes anything.
on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/pending/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for diffing
        run: git fetch origin main

      # CRITICAL: always run the validator that lives on `main`, never the
      # PR's own copy. Otherwise a malicious PR could simply edit
      # validate-submission.mjs to always report "valid".
      - name: Use trusted validator from main
        run: git checkout origin/main -- scripts/canonical.mjs scripts/validate-submission.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation
        env:
          # Read-only scope (contents: read, declared above) — used only to
          # query the Search API for the author's recent PR count. Never
          # used to write anything from this unprivileged workflow.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/validate-submission.mjs

      - name: Record PR context for the privileged workflow
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > head-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: validation-result
          path: |
            validation-result.json
            pr-number.txt
            head-sha.txt
          retention-days: 1
