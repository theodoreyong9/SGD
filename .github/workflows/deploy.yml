name: Deploy to Pages

# TWO triggers, for a precise reason:
#
#   - `push: branches: [main]` covers a MANUAL push (direct repo edit,
#     first deployment, etc.).
#
#   - `workflow_run` covers this project's real case: when
#     process-submission.yml pushes a commit with the automatic
#     GITHUB_TOKEN, GitHub DELIBERATELY blocks that push event from
#     chain-triggering another workflow — an infinite-loop protection
#     built into Actions, documented but easy to forget. Without this
#     second trigger, every graph updated by an accepted Issue would
#     NEVER be republished on Pages until someone manually pushes
#     something else to `main`. That's exactly what happened before this
#     trigger was added: the graph was up to date in the repo, but the
#     site kept serving a stale version.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Process submission (Issue)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Doesn't redeploy after a rejected submission (no change to the
    # graph) or after a failed processing workflow — only after a manual
    # push, an explicit trigger, or a successful Issue processing run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate PWA icons (deterministic — checked in, this just verifies)
        run: node scripts/generate-icons.mjs
      - name: Verify service worker asset list matches disk
        run: node scripts/check-sw-manifest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
