name: Merge & update graph

# SECURITY: triggered by `workflow_run`, which always executes the workflow
# file as it exists on the default branch, in the base repo's context — a
# fork can never alter what THIS workflow does, unlike `pull_request_target`
# checking out fork code directly. It only trusts the verdict artifact
# produced by the unprivileged validate-submission.yml run, and re-checks
# the PR hasn't moved since that verdict was issued.
on:
  workflow_run:
    workflows: ["Validate submission"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: graph-update
  cancel-in-progress: false

jobs:
  merge-and-process:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download validation artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: validation-result
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read verdict
        id: verdict
        run: |
          valid=$(node -pe "require('./validation-result.json').valid")
          pr_number=$(cat pr-number.txt)
          head_sha=$(cat head-sha.txt)
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Stop here if invalid
        if: steps.verdict.outputs.valid != 'true'
        run: |
          echo "Soumission jugée invalide — aucune fusion."
          exit 0

      - name: Re-check the PR hasn't changed since validation
        if: steps.verdict.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha=$(gh pr view "${{ steps.verdict.outputs.pr_number }}" \
            --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          if [ "$current_sha" != "${{ steps.verdict.outputs.head_sha }}" ]; then
            echo "La PR a bougé depuis la validation (nouveau commit). On ignore ce run."
            exit 1
          fi

      - name: Squash-merge the PR
        if: steps.verdict.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.verdict.outputs.pr_number }}" \
            --repo "${{ github.repository }}" --squash --delete-branch

      - name: Checkout main (post-merge, trusted state)
        if: steps.verdict.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.verdict.outputs.valid == 'true'
        with:
          node-version: 20

      - name: Process graph (canonicalization, novelty, diminishing contribution)
        if: steps.verdict.outputs.valid == 'true'
        run: node scripts/process-graph.mjs

      - name: Commit updated graph
        if: steps.verdict.outputs.valid == 'true'
        run: |
          git config user.name "sgd-bot"
          git config user.email "sgd-bot@users.noreply.github.com"
          git add data/graph.json submissions/
          git diff --cached --quiet && echo "Rien à committer" || git commit -m "chore: update graph after merge"
          git push origin main
